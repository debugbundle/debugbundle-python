[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "debugbundle-python"
version = "1.1.1"
description = "DebugBundle SDK for Python"
readme = "README.md"
requires-python = ">=3.10"
license = "AGPL-3.0-only"
authors = [{ name = "DebugBundle" }]
keywords = ["debugbundle", "debugging", "ai-agent", "error-tracking"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Framework :: Django",
  "Framework :: FastAPI",
  "Framework :: Flask",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed"
]
dependencies = [
  "httpx>=0.27,<0.29"
]

[project.optional-dependencies]
dev = [
  "build>=1,<2",
  "django>=5,<6",
  "fastapi>=0.115,<1",
  "flask>=3,<4",
  "jsonschema>=4.23,<5",
  "loguru>=0.7,<1",
  "mypy>=1.15,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.11,<0.12",
  "structlog>=24,<26",
  "twine>=5,<7"
]

[project.urls]
Homepage = "https://debugbundle.com/docs/sdks/python"
Repository = "https://github.com/debugbundle/debugbundle-python"
Issues = "https://github.com/debugbundle/debugbundle-python/issues"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.10"
files = ["src"]
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
pretty = true

[tool.coverage.run]
source = ["src/debugbundle"]

[tool.coverage.report]
show_missing = true
